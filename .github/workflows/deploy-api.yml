name: Deploy da API

# Deploy do backend na VPS. O frontend e publicado pela Vercel no push da main.
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: producao

    steps:
      - name: Publicar na VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            cd /home/deploy/cripto-curitiba
            ./deploy/deploy.sh

      - name: Conferir se a API respondeu
        run: |
          for tentativa in 1 2 3 4 5; do
            if curl -fsS "${{ secrets.API_HEALTH_URL }}" > /dev/null; then
              echo "API no ar"
              exit 0
            fi
            echo "tentativa $tentativa falhou; aguardando"
            sleep 5
          done
          echo "API nao respondeu apos o deploy"
          exit 1
